<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-purple"></div>
        <div class="blob blob-blue"></div>
    </div>
    
    <div class="container glass-panel">
        <header>
            <h1>SRT Translator</h1>
            <p>Translate English subtitles to French</p>
        </header>

        <main>
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <div class="icon">
                        <!-- Simple SVG icon instead of emoji -->
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <h2>Drag & Drop your .srt file here</h2>
                    <p>or click to browse</p>
                    <input type="file" id="file-input" accept=".srt" class="hidden">
                </div>
            </div>

            <div id="progress-container" class="progress-container hidden">
                <div class="file-info" id="file-info">Translating: filename.srt</div>
                <div class="progress-bar-wrapper">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div class="status-text">
                    <span id="progress-text">0%</span>
                    <span id="status-message">Initializing...</span>
                </div>
            </div>

            <div id="success-container" class="success-container hidden">
                <div class="icon success-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <h2>Translation Complete</h2>
                <button id="download-btn" class="primary-btn">Download French Subtitles</button>
                <button id="reset-btn" class="secondary-btn">Translate Another File</button>
            </div>
            
            <div id="error-container" class="error-container hidden">
                <p id="error-message"></p>
                <button id="error-reset-btn" class="secondary-btn">Try Again</button>
            </div>
        </main>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
