services:
  - type: web
    name: srt-translator
    env: python
    region: frankfurt # You can change this to ohio, oregon, etc.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
